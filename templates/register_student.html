<!DOCTYPE html>
<html>

<head>

    <title>Student Registration</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/registration.css') }}">

</head>

<body>

<div class="container">

    <div class="card">

        <h1>Student Registration</h1>

        <p class="subtitle">
            Register a student for face recognition
        </p>


        <!-- Student ID -->

        <div class="form-group">

            <label>Student ID</label>

            <input type="text"
                   id="student_id"
                   placeholder="Enter Student ID">

        </div>


        <!-- Roll Number -->

        <div class="form-group">

            <label>Roll No</label>

            <input type="text"
                   id="roll_no"
                   placeholder="Enter Roll Number">

        </div>


        <!-- Student Name -->

        <div class="form-group">

            <label>Student Name</label>

            <input type="text"
                   id="name"
                   placeholder="Enter Student Name">

        </div>


        <!-- Department -->

        <div class="form-group">

            <label>Department</label>

            <input type="text"
                   id="department"
                   placeholder="Enter Department">

        </div>


        <!-- Semester -->

        <div class="form-group">

            <label>Semester</label>

            <input type="text"
                   id="semester"
                   placeholder="Enter Semester">

        </div>


        <!-- Email -->

        <div class="form-group">

            <label>Email</label>

            <input type="email"
                   id="email"
                   placeholder="Enter Email">

        </div>


        <!-- Camera -->

        <h2>Face Capture</h2>

        <video id="video"
               width="400"
               height="300"
               autoplay>
        </video>

        <br><br>


        <!-- Camera Buttons -->

        <button type="button"
                onclick="startCamera()">
            Start Camera
        </button>

        <button type="button"
                onclick="captureImage()">
            Capture Image
        </button>


        <!-- Image Counter -->

        <p>
            Images Captured:
            <span id="count">0</span> / 20
        </p>


        <canvas id="canvas"
                style="display:none;">
        </canvas>


        <!-- Image Preview -->

        <div id="preview"></div>


        <br><br>


        <!-- Register -->

        <button type="button"
                onclick="registerStudent()">
            Register Student
        </button>


        <p id="message"></p>

    </div>

</div>


<script>

let images = [];

let cameraStream = null;


// -------------------------------------------------
// START CAMERA
// -------------------------------------------------

function startCamera() {

    navigator.mediaDevices.getUserMedia({
        video: true
    })

    .then(function(stream) {

        cameraStream = stream;

        document.getElementById("video").srcObject = stream;

    })

    .catch(function(error) {

        console.log(error);

        alert(
            "Camera access denied or camera not available."
        );

    });

}


// -------------------------------------------------
// CAPTURE IMAGE
// -------------------------------------------------

function captureImage() {

    if (images.length >= 20) {

        alert("Maximum 20 images reached!");

        return;
    }


    const video =
        document.getElementById("video");

    const canvas =
        document.getElementById("canvas");


    // Make sure camera is running

    if (video.videoWidth === 0) {

        alert("Please start the camera first.");

        return;
    }


    canvas.width = video.videoWidth;

    canvas.height = video.videoHeight;


    const context =
        canvas.getContext("2d");


    context.drawImage(
        video,
        0,
        0,
        canvas.width,
        canvas.height
    );


    const image =
        canvas.toDataURL("image/jpeg");


    images.push(image);


    // ---------------------------------------------
    // SHOW THUMBNAIL
    // ---------------------------------------------

    const img =
        document.createElement("img");


    img.src = image;

    img.width = 100;

    img.height = 75;


    img.style.margin = "5px";


    document
        .getElementById("preview")
        .appendChild(img);


    // ---------------------------------------------
    // UPDATE COUNTER
    // ---------------------------------------------

    document
        .getElementById("count")
        .innerText = images.length;

}


// -------------------------------------------------
// REGISTER STUDENT
// -------------------------------------------------

function registerStudent() {


    const studentId =
        document.getElementById("student_id").value.trim();


    const rollNo =
        document.getElementById("roll_no").value.trim();


    const name =
        document.getElementById("name").value.trim();


    const department =
        document.getElementById("department").value.trim();


    const semester =
        document.getElementById("semester").value.trim();


    const email =
        document.getElementById("email").value.trim();


    // ---------------------------------------------
    // VALIDATION
    // ---------------------------------------------

    if (
        studentId === "" ||
        rollNo === "" ||
        name === "" ||
        department === "" ||
        semester === "" ||
        email === ""
    ) {

        document
            .getElementById("message")
            .innerText =
            "Please fill in all student details.";

        return;
    }


    if (images.length < 5) {

        document
            .getElementById("message")
            .innerText =
            "Please capture at least 5 facial images.";

        return;
    }


    // ---------------------------------------------
    // CREATE FORM DATA
    // ---------------------------------------------

    const formData = new FormData();


    formData.append(
        "student_id",
        studentId
    );


    formData.append(
        "roll_no",
        rollNo
    );


    formData.append(
        "name",
        name
    );


    formData.append(
        "department",
        department
    );


    formData.append(
        "semester",
        semester
    );


    formData.append(
        "email",
        email
    );


    // Add facial images

    images.forEach(function(image) {

        formData.append(
            "images[]",
            image
        );

    });


    // ---------------------------------------------
    // SEND TO FLASK
    // ---------------------------------------------

    fetch("/register", {

        method: "POST",

        body: formData

    })


    .then(response => response.json())


    .then(data => {

        document
            .getElementById("message")
            .innerText =
            data.message;


        if (data.success) {

            // Stop camera

            if (cameraStream) {

                cameraStream
                    .getTracks()
                    .forEach(track => track.stop());

            }


            // Clear captured images

            images = [];


            document
                .getElementById("count")
                .innerText = "0";


            document
                .getElementById("preview")
                .innerHTML = "";

        }

    })


    .catch(error => {

        console.log(error);

        document
            .getElementById("message")
            .innerText =
            "Registration failed. Please try again.";

    });

}

</script>


</body>

</html>
