<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f6f8;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            color: #171717;
        }

        /* MAIN LOGIN CARD */

        .login-container {
            width: 390px;
            background: white;

            padding: 38px 35px 30px;

            border-radius: 14px;

            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);

            text-align: center;
        }

        /* ICON */

        .icon {
            width: 58px;
            height: 58px;

            margin: 0 auto 18px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #111;
            color: white;

            border-radius: 12px;

            font-size: 27px;
        }

        /* HEADINGS */

        h1 {
            font-size: 22px;
            font-weight: 600;

            margin-bottom: 6px;
        }

        .subtitle {
            color: #888;
            font-size: 13px;

            margin-bottom: 28px;
        }

        /* INPUT */

        .input-group {
            text-align: left;
            margin-bottom: 17px;
        }

        .input-group label {
            display: block;

            font-size: 12px;
            font-weight: 600;

            color: #555;

            margin-bottom: 7px;
        }

        .input-box {
            width: 100%;

            padding: 12px 13px;

            border: 1px solid #ddd;

            border-radius: 7px;

            font-size: 13px;

            background: #fafafa;

            transition: 0.2s;
        }

        .input-box:focus {
            outline: none;

            background: white;

            border-color: #111;

            box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.05);
        }

        /* LOGIN BUTTON */

        .login-button {
            width: 100%;

            padding: 12px;

            margin-top: 5px;

            background: #111;

            color: white;

            border: none;

            border-radius: 7px;

            font-size: 13px;
            font-weight: 600;

            cursor: pointer;

            transition: 0.2s;
        }

        .login-button:hover {
            background: #2b2b2b;

            transform: translateY(-1px);
        }

        /* ERROR */

        .error {
            margin-top: 17px;

            padding: 10px;

            background: #fff0f0;

            color: #d63031;

            border: 1px solid #ffd6d6;

            border-radius: 7px;

            font-size: 12px;
        }

        /* FOOTER */

        .footer {
            margin-top: 25px;

            padding-top: 18px;

            border-top: 1px solid #eee;

            font-size: 11px;

            color: #999;

            line-height: 1.5;
        }

        .footer strong {
            color: #666;
            font-weight: 600;
        }

        /* MOBILE */

        @media (max-width: 500px) {

            .login-container {
                width: calc(100% - 30px);

                padding: 32px 25px 25px;
            }

        }

    </style>

</head>

<body>

    <div class="login-container">

        <div class="icon">
            🔐
        </div>

        <h1>Face Recognition</h1>

        <p class="subtitle">
            Admin Login
        </p>

        <form method="POST" action="/login">

            <div class="input-group">

                <label>Username</label>

                <input
                    class="input-box"
                    type="text"
                    name="username"
                    placeholder="Enter your username"
                    required
                >

            </div>


            <div class="input-group">

                <label>Password</label>

                <input
                    class="input-box"
                    type="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <button
                class="login-button"
                type="submit"
            >
                Login →
            </button>

        </form>


        {% if error %}

        <div class="error">
            {{ error }}
        </div>

        {% endif %}


        <div class="footer">

            <strong>AI-Based Intelligent Face Recognition System</strong>

            <br>

            Secure Admin Access

        </div>

    </div>

</body>

</html>
